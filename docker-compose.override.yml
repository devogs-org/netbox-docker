services:
  netbox:
    # Transitional: the wg0 mapping stays until the remaining clients (Semaphore environment) use http://netbox:8080
    ports:
      - "127.0.0.1:8001:8080"
      - "10.255.255.1:8001:8080"
    # Traefik front door: https://netbox.<DOMAIN>. `backend` is the service-to-service network (netbox-mcp, Semaphore, ...)
    networks:
      default: {}
      proxy: {}
      backend: {}
    environment:
      CSRF_TRUSTED_ORIGINS: "https://netbox.${DOMAIN:-devogs.xyz}"
    labels:
      traefik.enable: "true"
      traefik.http.routers.netbox.rule: "Host(`netbox.${DOMAIN:-devogs.xyz}`)"
      traefik.http.routers.netbox.entrypoints: "websecure"
      traefik.http.routers.netbox.tls: "true"
      traefik.http.routers.netbox.middlewares: "internal-only@file,secure-headers@file"
      traefik.http.services.netbox.loadbalancer.server.port: "8080"
    # healthcheck:
      # Time for which the health check can fail after the container is started.
      # This depends mostly on the performance of your database. On the first start,
      # when all tables need to be created the start_period should be higher than on
      # subsequent starts. For the first start after major version upgrades of NetBox
      # the start_period might also need to be set higher.
      # Default value in our docker-compose.yml is 90s
      # start_period: 90s
    # environment:
      # SKIP_SUPERUSER: "false"
      # SUPERUSER_API_KEY: ""
      # SUPERUSER_API_TOKEN: ""
      # SUPERUSER_EMAIL: ""
      # SUPERUSER_NAME: ""
      # SUPERUSER_PASSWORD: ""
      # SSO Configuration
      # SOCIAL_AUTH_OKTA_OPENIDCONNECT_KEY: "your_okta_client_id"
      # SOCIAL_AUTH_OKTA_OPENIDCONNECT_API_URL: "https://your-domain.okta.com"
      # SOCIAL_AUTH_GOOGLE_OAUTH2_KEY: "your_google_client_id"
    # secrets:
      # - okta_openidconnect_secret
      # - google_oauth2_secret

networks:
  proxy:
    external: true
  backend:
    external: true

# Uncomment to use Docker secrets for SSO credentials
